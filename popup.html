  font-family: var(--font); font-size: 11px; font-weight: 600;
  cursor: default; transition: background 0.15s, box-shadow 0.15s;
  white-space: nowrap; flex-shrink: 0;
}
.bk-org-undo-btn:hover { background: rgba(0,229,255,0.15); box-shadow: 0 0 10px rgba(0,229,255,0.18); }
.bk-org-undo-btn:disabled { opacity: 0.35; pointer-events: none; }
.bk-org-close-btn {
  width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  background: none; border: none; color: var(--text-4);
  cursor: default; border-radius: 4px; flex-shrink: 0; transition: color 0.15s;
}
.bk-org-close-btn:hover { color: var(--text-2); }
.bk-org-close-btn svg { width: 9px; height: 9px; }

/* ── Folder — glass card ── */
.bk-folder {
  margin-bottom: 16px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25),
              inset 0 1px 1px rgba(255, 255, 255, 0.12);
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.bk-folder:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(0, 229, 255, 0.3);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35),
              0 0 0 1px rgba(0, 229, 255, 0.1),
              inset 0 1px 1px rgba(255, 255, 255, 0.15);
}

/* ── Sub-folder (Nested) ── */
.bk-folder.bk-subfolder {
  margin-bottom: 2px;
  background: transparent;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border-radius: 0;
}
.bk-folder.bk-subfolder:hover {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
}
.bk-folder.bk-subfolder .bk-folder-hdr {
  padding: 10px 12px;
  border-radius: 8px;
}
.bk-folder.bk-subfolder .bk-folder-hdr:hover {
  background: rgba(255,255,255,0.06);
}
.bk-folder-hdr {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px;
  cursor: default; user-select: none; position: relative;
  transition: background 0.18s;
}
.bk-folder-hdr:hover { background: rgba(0,229,255,0.05); }

.bk-farr {
  color: var(--text-4); display: flex; align-items: center; flex-shrink: 0;
  transform: rotate(-90deg); margin-top: 3px;
  transition: transform 0.38s var(--ease-spring), color 0.2s;
}
.bk-farr.open { transform: rotate(0deg); color: #00E5FF; }
.bk-farr svg { width: 10px; height: 10px; }

.bk-folder-ico {
  color: var(--text-3); flex-shrink: 0; margin-top: 1px;
  transition: color 0.22s, filter 0.25s;
}
.bk-folder-hdr:hover .bk-folder-ico {
  color: #00E5FF;
  filter: drop-shadow(0 0 6px rgba(0,229,255,0.5));
}
.bk-folder-ico svg { width: 14px; height: 14px; }

.bk-folder-name {
  flex: 1; font-size: 14px; font-weight: 700; color: var(--text-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-width: 0; line-height: 1.4; letter-spacing: -0.2px;
  transition: color 0.22s;
}
.bk-folder-hdr:hover .bk-folder-name { color: #ffffff; }

.bk-folder-cnt {
  font-size: 10px; font-weight: 700;
  color: var(--text-4); font-variant-numeric: tabular-nums; flex-shrink: 0;
  background: rgba(255,255,255,0.07);
  padding: 2px 9px; border-radius: 20px; margin-top: 2px; align-self: flex-start;
  border: 1px solid rgba(255,255,255,0.10);
  transition: background 0.22s, color 0.22s, border-color 0.22s;
}
.bk-folder-hdr:hover .bk-folder-cnt {
  background: rgba(0,229,255,0.12); color: #00E5FF; border-color: rgba(0,229,255,0.25);
}

.bk-folder-acts { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; align-self: flex-start; margin-top: 1px; }
.bk-folder-hdr:hover .bk-folder-acts { opacity: 1; }
.bk-folder-del {
  width: 24px; height: 24px; background: none; border: none;
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); cursor: default;
  transition: background 0.15s, color 0.15s, transform 0.15s;
}
.bk-folder-del:hover { background: rgba(239,68,68,0.14); color: #f87171; transform: scale(1.1); }
.bk-folder-del:active { transform: scale(0.88); }
.bk-folder-del svg { width: 9px; height: 9px; }

/* ── Folder children — spring expand ── */
.bk-folder-children {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows 0.38s var(--ease-spring);
}
.bk-folder-children.open { grid-template-rows: 1fr; }
.bk-fc-inner {
  overflow: hidden;
  background: rgba(0,0,0,0.12);
  border-top: 1px solid rgba(255,255,255,0.05);
}
.bk-folder-empty-msg {
  font-size: 11px; color: var(--text-4);
  padding: 8px 14px 12px 40px; font-style: italic; opacity: 0.65;
}

/* ── Bookmark Item ── */
.bk-item {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 14px; margin-bottom: 4px;
  cursor: default; position: relative; min-width: 0;
  transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
  background: rgba(255, 255, 255, 0.015);
  border: 1px solid transparent;
  border-radius: 12px;
}
.bk-item:last-child { margin-bottom: 0; }

.bk-item:hover {
  background: rgba(255, 255, 255, 0.045);
  border-color: rgba(255, 255, 255, 0.06);
}
.bk-item:active { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.15); }

/* Favicon */
.bk-fav-wrap {
  width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px;
  position: relative; border-radius: 4px; overflow: hidden;
}
@keyframes bkShimmer {
  0%   { background-position: -200% 0; }
  100% { background-position:  200% 0; }
}
.bk-fav-skeleton {
  position: absolute; inset: 0;
  background: linear-gradient(90deg,
    rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
  background-size: 200% 100%;
  animation: bkShimmer 1.4s ease-in-out infinite;
  border-radius: 4px;
}
.bk-fav {
  position: absolute; inset: 0;
  width: 18px; height: 18px; object-fit: contain; border-radius: 4px;
  opacity: 0; transition: opacity 0.28s, filter 0.22s;
}
.bk-fav.loaded { opacity: 1; }
.bk-item:hover .bk-fav.loaded { filter: drop-shadow(0 0 6px rgba(0,229,255,0.45)); }
.bk-fav-ph {
  width: 18px; height: 18px; flex-shrink: 0; border-radius: 4px; margin-top: 2px;
  background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;
}

.bk-item-info { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.bk-item-path { font-size: 10px; color: var(--text-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-item-title {
  font-size: 13.5px; font-weight: 600; color: rgba(255, 255, 255, 0.9);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  cursor: pointer; line-height: 1.4; letter-spacing: -0.1px;
  transition: color 0.18s;
}
.bk-item:hover .bk-item-title { color: #ffffff; }
.bk-item-url {
  font-size: 11px; color: rgba(255, 255, 255, 0.35);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  cursor: text; line-height: 1.3;
  transition: color 0.18s;
}
.bk-item:hover .bk-item-url { color: rgba(0,229,255,0.65); }

.bk-item-acts {
  display: flex; gap: 4px; opacity: 0;
  transition: opacity 0.15s; flex-shrink: 0; align-self: center;
}
.bk-item:hover .bk-item-acts { opacity: 1; }
.bk-item-open, .bk-item-del {
  width: 24px; height: 24px; background: none; border: none;
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  cursor: default;
  transition: background 0.15s, color 0.15s, transform 0.15s, box-shadow 0.15s;
}
.bk-item-open { color: var(--text-3); }
.bk-item-open:hover {
  background: rgba(0,229,255,0.12); color: #00E5FF;
  box-shadow: 0 0 10px rgba(0,229,255,0.2);
}
.bk-item-open:active { transform: scale(0.88); }
.bk-item-open svg { width: 11px; height: 11px; }
.bk-item-del { color: var(--text-3); }
.bk-item-del:hover { background: rgba(239,68,68,0.14); color: #f87171; box-shadow: 0 0 10px rgba(239,68,68,0.18); }
.bk-item-del:active { transform: scale(0.88); }
.bk-item-del svg { width: 9px; height: 9px; }

/* ── Inline edit ── */
.bk-inline-inp {
  background: rgba(0,229,255,0.06); border: 1px solid rgba(0,229,255,0.30);
  border-radius: 6px; padding: 3px 8px;
  font-family: var(--font); color: var(--text); outline: none;
  width: 100%; font-size: 13px;
  box-shadow: 0 0 0 0 rgba(0,229,255,0);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.bk-inline-inp:focus {
  border-color: rgba(0,229,255,0.55);
  box-shadow: 0 0 0 3px rgba(0,229,255,0.10);
}
.bk-inline-inp.url { font-size: 11px; }

/* ── Empty state ── */
.bk-empty {
  text-align: center; padding: 50px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.bk-empty-ico { font-size: 32px; opacity: 0.25; }
.bk-empty-txt { color: var(--text-4); font-size: 13px; line-height: 1.6; }

/* ── Drag & Drop ── */
.bk-drag-handle {
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; width: 14px; color: rgba(0,229,255,0.30);
  opacity: 0; transition: opacity 0.15s; cursor: default;
  align-self: flex-start; margin-top: 3px;
}
.bk-item:hover .bk-drag-handle { opacity: 1; }
.bk-item[draggable="true"] { cursor: default; }
.bk-item.is-dragging { opacity: 0.18; pointer-events: none; transform: scale(0.96); }
.bk-item.drag-over-top    { box-shadow: inset 0  2px 0 #00E5FF; }
.bk-item.drag-over-bottom { box-shadow: inset 0 -2px 0 #00E5FF; }
.bk-folder-hdr.drag-over-folder {
  background: rgba(0,229,255,0.10) !important;
  box-shadow: inset 0 0 0 1px rgba(0,229,255,0.30);
}

/* ═══════════════════════════════════════════════════════════════════════
   SPLIT-SCREEN LAYOUT
   ═══════════════════════════════════════════════════════════════════════ */
#splitContainer {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
#mainContent {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
</style>
</head>
<body>

<!-- ═══ Topbar ═══ -->
<div class="topbar">
  <div class="brand">
    <div class="brand-indicator">
      <span class="brand-dot"></span>
      <span class="brand-label">Focus</span>
      <span class="brand-val" id="topbarFocusVal">--</span>

    </button>
    <button class="icon-btn" data-p="tasks" title="Tasks">
      <svg fill="none" viewBox="0 0 15 15"><path d="M3.5 7.5L6.5 10.5L11.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1.5" y="1.5" width="12" height="12" rx="3" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="icon-btn" data-p="bookmarks" title="Browser Bookmarks">
      <svg fill="none" viewBox="0 0 15 15"><path d="M4 2h7a1 1 0 011 1v10l-4.5-2.5L3 13V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" data-p="stats" title="Stats">
      <svg fill="none" viewBox="0 0 15 15"><rect x="1.5" y="8" width="3" height="5.5" rx="1" fill="currentColor" opacity="0.85"/><rect x="6" y="4.5" width="3" height="9" rx="1" fill="currentColor" opacity="0.85"/><rect x="10.5" y="1.5" width="3" height="12" rx="1" fill="currentColor" opacity="0.85"/></svg>
    </button>
    <button class="icon-btn" id="homeBtn" title="Dashboard">
      <svg fill="none" viewBox="0 0 15 15"><path d="M2.5 7.5L7.5 2.5L12.5 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 6.5V12a.5.5 0 00.5.5H6a.5.5 0 00.5-.5V9.5a1 1 0 011-1h0a1 1 0 011 1V12a.5.5 0 00.5.5h1.5a.5.5 0 00.5-.5V6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<div id="splitContainer">
<div id="mainContent">

<!-- ═══ TASKS PANEL ═══ -->
<div class="panel active" id="panel-tasks">
  <div class="dash-head">
    <div class="dash-ring-wrap">
      <svg class="dash-ring-svg" viewBox="0 0 58 58" xmlns="http://www.w3.org/2000/svg">
        <circle class="dash-ring-bg" cx="29" cy="29" r="22"/>
        <circle class="dash-ring-fill" id="dashRingFill" cx="29" cy="29" r="22"/>
      </svg>
      <div class="dash-ring-center">
        <span class="ring-n" id="ringDoneN">0</span>
        <span class="ring-d" id="ringTotalD">/0</span>
      </div>
    </div>
    <div class="dash-info">
      <div class="dash-row-a">
        <span class="dash-est" id="estLbl">Est: --</span>
        <span class="dash-done" id="doneLbl">0/0</span>
      </div>
      <div class="dash-row-b">
        <span class="dash-chip chip-done" id="todayDoneChip">
          <svg width="10" height="10" fill="none" viewBox="0 0 10 10"><path d="M2 5.5L4 7.5L8 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          0
        </span>
        <span class="dash-chip chip-focus" id="todayFocusChip">
          <svg width="10" height="10" fill="none" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.2"/><path d="M5 3.2V5L6.2 6.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          --
        </span>
      </div>
      <div class="dash-row-c">
        <span class="dash-e-lbl">Energy</span>
        <div class="dash-e-track">
          <div class="dash-e-fill" id="energyFill" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- List Selector Bar -->
  <div class="list-selector" id="listSelector">
    <div class="list-selector-dot" id="listSelDot"></div>
    <span class="list-selector-name" id="listSelName">My Tasks</span>
    <span class="list-selector-count" id="listSelCount">0</span>
    <svg class="list-selector-chevron" fill="none" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <!-- List Dropdown -->
  <div class="list-dropdown-wrap">
    <div class="list-dropdown" id="listDropdown"></div>
  </div>

  <div class="task-list" id="taskList"></div>

  <div class="tasks-btm" id="tasksBtm">
    <button class="add-task-btn ripple-btn" id="addTaskBtn">
      <span class="atb-ico" id="atbIco">+</span>
      <span class="atb-txt" id="atbTxt">ADD TASK</span>
    </button>
    <div class="add-sheet" id="addSheet">
      <div class="add-sheet-inner">
        <div class="add-fields">
          <div class="add-field">
            <span class="add-lbl">Title</span>
            <input class="add-inp" id="newTaskTitle" placeholder="Enter task title..." autocomplete="off"/>
          </div>
          <div class="add-field add-field-est">
            <span class="add-lbl">Est time</span>
            <input class="add-inp-est" id="newTaskMin" placeholder="HH:MM" autocomplete="off" maxlength="5" inputmode="numeric"/>
          </div>
        </div>
        <div class="add-row">
          <span class="add-hint">Press Enter to save</span>
          <button class="add-confirm ripple-btn" id="saveTaskBtn">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- List Modal (create / edit / delete confirm) -->
  <div class="list-modal-overlay" id="listModalOverlay">
    <div class="list-modal" id="listModal">
      <div class="list-modal-title" id="listModalTitle">New List</div>
      <div id="listModalBody"></div>
      <div class="list-modal-actions" id="listModalActions"></div>
    </div>
  </div>

</div>

<!-- ═══ ORGANIZE PANEL ═══ -->
<div class="panel" id="panel-organize">
  <div class="sg-hdr">
    <span class="sg-title" style="text-align:left">Smart Groups</span>
    <div class="sg-hdr-right">
      <label class="sg-auto-wrap" title="Auto-group new tabs">
        <span class="sg-auto-txt">Auto</span>
        <div class="toggle" id="autoToggle"><div class="toggle-knob"></div></div>
      </label>
      <button class="sg-hdr-btn sg-grid-btn" id="sgGridToggle" title="Grid view">
        <svg fill="none" viewBox="0 0 14 14"><rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <div class="sg-search-row">
    <div class="sg-search-wrap">
      <span class="sg-search-ico">
        <svg fill="none" viewBox="0 0 13 13"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </span>
      <input class="sg-search" id="sgSearch" placeholder="Search tabs..." autocomplete="off"/>
    </div>
  </div>

  <div class="sg-action-area">
    <div class="sg-dual">
      <button class="sg-dual-a" id="organizeBtn">Organize</button>
      <button class="sg-dual-b" id="ungroupAllBtn">Ungroup All</button>
    </div>
  </div>

  <div class="sg-groups" id="resultArea"></div>
</div>

<!-- ═══ STATS PANEL ═══ -->
<div class="panel" id="panel-stats">
  <div class="sec-header">
    <span class="sec-title">Statistics</span>
    <span class="sync-dot" id="statsSyncDot"></span>
  </div>
  <div class="stats-filter-bar">
    <button class="stats-filter-btn active" data-filter="today">Today</button>
    <button class="stats-filter-btn" data-filter="week">7 Days</button>
    <button class="stats-filter-btn" data-filter="month">30 Days</button>
    <button class="stats-filter-btn" data-filter="all">All Time</button>
  </div>
  <div class="panel-scroll">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="statTime">--</div>
        <div class="stat-lbl">Focus Time</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statTop">--</div>
        <div class="stat-lbl">Top Category</div>
      </div>
    </div>
    <div class="stats-section-hdr">
      <span>Most Visited</span>
      <select class="stats-sort-sel" id="statsSortSel">
        <option value="time">By Time</option>
        <option value="alpha">A-Z</option>
      </select>
    </div>
    <div class="top-sites-list" id="topSitesList">
      <div class="stats-empty">No data yet.</div>
    </div>
    <div class="stats-section-hdr" style="margin-top:4px">
      <span>By Category</span>
    </div>
    <div class="bar-list" id="barList">
      <div class="empty-state">
        <div class="empty-icon">
          <svg fill="none" viewBox="0 0 18 18"><rect x="1" y="9" width="3.5" height="7.5" rx="1" fill="currentColor" opacity="0.6"/><rect x="7.25" y="5" width="3.5" height="11.5" rx="1" fill="currentColor" opacity="0.6"/><rect x="13.5" y="1.5" width="3.5" height="15" rx="1" fill="currentColor" opacity="0.6"/></svg>
        </div>
        <div class="empty-text">Organize your tabs<br>and start tracking time.</div>
      </div>
    </div>
    <div class="stats-actions">
      <button class="clear-btn" id="clearBtn">Clear All Data</button>
      <button class="stats-export-btn" id="statsExportBtn">
        <svg fill="none" viewBox="0 0 14 14" width="12" height="12"><path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export
      </button>
    </div>
  </div>
</div>
<!-- ═══ BOOKMARKS PANEL ═══ -->
<div class="panel" id="panel-bookmarks">
  <div class="bk-hdr">
    <span class="bk-hdr-title">Bookmarks</span>
    <div class="bk-hdr-btns">
      <label class="sg-auto-wrap" id="bkAutoWrap" title="Auto-organize newly added bookmarks">
        <span class="sg-auto-txt">Auto</span>
        <div class="toggle" id="bkAutoToggle"><div class="toggle-knob"></div></div>
      </label>
      <button class="bk-hdr-btn bk-save-tab-btn" id="bkSaveTabBtn" title="Save current tab">
        <svg fill="none" viewBox="0 0 14 14"><path d="M3.5 2h7a1 1 0 011 1v8.5l-4-2.2-4 2.2V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5 6h4M7 4.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button class="bk-hdr-btn bk-org-btn" id="bkOrgBtn" title="Auto-organize bookmarks">
        <svg fill="none" viewBox="0 0 14 14"><rect x="1.5" y="2" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="8.5" y="2" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="8" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M8.5 10h4M10.5 8v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="bk-search-row">
    <div class="bk-search-wrap">
      <span class="bk-search-ico">
        <svg fill="none" viewBox="0 0 13 13"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </span>
      <input class="bk-search" id="bkSearch" placeholder="Search by title or URL..." autocomplete="off"/>
      <button class="bk-search-clear" id="bkSearchClear" title="Clear">
        <svg fill="none" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="bk-add-form" id="bkAddForm">
    <input class="bk-form-inp" id="bkNewTitle" placeholder="Title..." autocomplete="off"/>
    <input class="bk-form-inp" id="bkNewUrl" placeholder="https://..." autocomplete="off"/>
    <div class="bk-form-actions">
      <button class="bk-form-cancel" id="bkFormCancel">Cancel</button>
      <button class="bk-form-save" id="bkFormSave">Save</button>
    </div>
  </div>

  <div class="bk-org-bar" id="bkOrgBar" hidden></div>
  <div class="bk-tree" id="bkTree"></div>
</div>

<!-- ═══ Focus Section (custom blocklist + stats) ═══ -->
<div class="focus-section" id="focusSection">
  <div class="focus-section-hdr">
    <span class="focus-section-title">Blocked Sites</span>
    <span class="focus-stats-chip" id="focusStatsChip">0 blocked today</span>
  </div>
  <div class="blocklist-add-row">
    <input class="blocklist-inp" id="blocklistInp" placeholder="example.com" autocomplete="off" spellcheck="false"/>
    <button class="blocklist-add-btn" id="blocklistAddBtn">Block</button>
  </div>
  <div class="blocklist-list" id="blocklistList"></div>
</div>

<!-- ═══ Bottom Nav ═══ -->
<div class="bottom-nav">
  <button class="bnav-btn ripple-btn" id="allTabsBtn">
    <svg fill="none" viewBox="0 0 13 13"><rect x="1" y="2.5" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 5.5h11" stroke="currentColor" stroke-width="1.2"/></svg>
    All Tabs
  </button>
  <button class="bnav-btn" id="historyBtn" title="Stats">
    <svg fill="none" viewBox="0 0 13 13"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 4v2.5l1.8 1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="snd-btn" id="sndBtn" title="Sound effects">
    <svg fill="none" viewBox="0 0 14 14"><path d="M2.5 5.3H4.6L8.2 2.2V11.8L4.6 8.7H2.5V5.3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M10.2 5.2C10.9 5.8 11.4 6.8 11.4 7.9C11.4 9 10.9 10 10.2 10.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </button>
  <div class="bnav-sep"></div>
  <div class="bnav-focus">
    <span class="bnav-focus-lbl">FOCUS</span>
    <div class="toggle" id="focusToggle"><div class="toggle-knob"></div></div>
  </div>
</div>

</div><!-- /#mainContent -->


</div><!-- /#splitContainer -->

<script src="categorizer.js"></script>
<script src="bk-categorizer.js"></script>
<script src="knowledge-base.js"></script>

<script src="popup.js"></script>
</body>
